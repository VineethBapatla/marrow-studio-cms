<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin login — Marrow Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card {
    width: 100%;
    max-width: 380px;
    padding: 44px 36px;
    border: 1px solid var(--color-stone-line);
    border-radius: var(--radius-s);
    background: var(--color-white);
  }
  .login-card .brand { justify-content: center; margin-bottom: 6px; font-size: 1.2rem; }
  .login-card p.lede { text-align: center; margin-inline: auto; font-size: 0.92rem; margin-bottom: 28px; }
  .login-error {
    display: none;
    background: rgba(178, 58, 46, 0.08);
    border: 1px solid #B23A2E;
    color: #B23A2E;
    padding: 12px 16px;
    border-radius: var(--radius-s);
    font-size: 0.88rem;
    margin-bottom: 18px;
  }
  .login-error.is-visible { display: block; }
  .login-card .btn { width: 100%; justify-content: center; margin-top: 6px; }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand" style="display:flex;"><span class="brand__mark">◆</span> Marrow Studio</div>
  <p class="lede">Admin panel</p>

  <div id="login-error" class="login-error" role="alert"></div>

  <form id="login-form">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field" style="margin-bottom:8px;">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn--primary">Log in</button>
  </form>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('login-error');
    errorBox.classList.remove('is-visible');

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || 'Login failed.';
        errorBox.classList.add('is-visible');
        return;
      }
      window.location.href = '/admin';
    } catch (err) {
      errorBox.textContent = 'Could not reach the server.';
      errorBox.classList.add('is-visible');
    }
  });
</script>

</body>
</html>
